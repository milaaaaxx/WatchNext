<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Keep your movies and series in one watchlist, track what you've watched and save your star ratings.">
    <title>WatchNext</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main>
        <section class="entry-panel" aria-labelledby="page-title">
        <h1 id="page-title">WatchNext</h1>
        <p>Make a list of your movies/series that you waitin to ever watch!</p>
        <p>your next obsession starts here</p>

        <form id="watchlist-form">
            <div>
                <label for="title">Title</label>
                <input type="text" name="title" id="title" maxlength="255" required>
            </div>
            <div>
                <label for="type">Type</label>
                <select name="type" id="type">
                    <option value="movie">Movies</option>
                    <option value="series">Series</option>
                </select>
            </div>
            <button type="submit">Add to watchlist</button>
        </form>
        </section>

        <section class="watchlist-panel" aria-labelledby="list-title">
        <h2 id="list-title">YOUR WATCHLIST BABY</h2>
        <p id="message" role="status"></p>
        <p id="empty-message">Your watchlist is empty. Add your first movie or series!</p>
        <ul id="watchlist"></ul>
        <p class="storage-note">Saved in this browser. Your list stays here when you come back, unless you clear your browser data.</p>
        <noscript>Please enable JavaScript to use your watchlist.</noscript>
        </section>
    </main>
</body>
</html>
